name: Flutter Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # در صورت ایجاد تگ (مثل v1.0.0) اجرا می‌شود
  workflow_dispatch: # امکان اجرای دستی

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # ۱. دانلود سورس کد از گیت‌هاب
      - name: Checkout repository
        uses: actions/checkout@v5

      # ۲. نصب جاوا (الزامی برای بیلد اندروید)
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # ۳. نصب و راه‌اندازی فلتر
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ۴. دریافت پکیج‌های پروژه
      - name: Install dependencies
        run: flutter pub get

      # ۵. ارتقای خودکار نسخه‌های Gradle و Android SDK
      - name: Upgrade Gradle & SDK Versions
        run: |
          # ارتقای نسخه Gradle Wrapper به 8.14
          sed -i 's/gradle-8.10.2/gradle-8.14/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/gradle-8.11.1/gradle-8.14/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/gradle-8.12/gradle-8.14/g' android/gradle/wrapper/gradle-wrapper.properties
          
          # ارتقای compileSdk به 34 برای رفع خطای lStar در پکیج Isar
          # استفاده از 2>/dev/null || true تا اگر فایل وجود نداشت خطا ندهد
          sed -i 's/compileSdkVersion 30/compileSdkVersion 34/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdkVersion 31/compileSdkVersion 34/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdkVersion 32/compileSdkVersion 34/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' android/app/build.gradle 2>/dev/null || true
          
          # برای پروژه‌هایی که از Kotlin DSL (build.gradle.kts) استفاده می‌کنند
          sed -i 's/compileSdk 30/compileSdk 34/g' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/compileSdk 31/compileSdk 34/g' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/compileSdk 32/compileSdk 34/g' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/compileSdk 33/compileSdk 34/g' android/app/build.gradle.kts 2>/dev/null || true

      # ۶. بیلد گرفتن APK رلیز
      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      # ۷. بیلد گرفتن AAB (برای انتشار در گوگل پلی)
      - name: Build App Bundle
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      # ۸. آپلود فایل APK به بخش Artifacts گیت‌هاب
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # ۹. آپلود فایل AAB به بخش Artifacts
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-aab
          path: build/app/outputs/flutter-bundle/app-release.aab

      # ۱۰. ساخت رلیز خودکار در گیت‌هاب (فقط وقتی تگ می‌زنید)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-bundle/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
